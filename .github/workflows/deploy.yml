name: Aura OS Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run Tests (skip if none)
        run: npm test -- --passWithNoTests --watchAll=false
        continue-on-error: true

      - name: Build Aura OS
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_SUNO_STREAM_GATEWAY: ${{ secrets.VITE_SUNO_STREAM_GATEWAY }}

      - name: Start Deployment Sequence
        run: echo "Launching Aura OS infrastructure..."
