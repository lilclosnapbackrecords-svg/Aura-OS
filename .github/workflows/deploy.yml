name: Aura OS Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (skip if none)
        run: npm test -- --passWithNoTests --watchAll=false
        continue-on-error: true

      - name: Build Aura OS
        run: npm run build

      - name: Start Deployment Sequence
        run: echo "Launching PUHD ENT infrastructure..."

